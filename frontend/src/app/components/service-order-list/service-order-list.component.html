<section class="list-container">
  <header class="list-header">
    <div>
      <h2>Ordens de Serviço</h2>
      <p>Busque OS por CPF ou veja todas as ordens cadastradas.</p>
    </div>
    <button class="primary" (click)="create()">Nova Ordem</button>
  </header>

  <section class="search-card">
    <div class="search-row">
      <label for="cpf-search">CPF</label>
      <input id="cpf-search" [(ngModel)]="searchCpf" placeholder="Digite o CPF" />
      <button class="secondary" type="button" (click)="search()">Buscar OS por CPF</button>
      <button class="ghost" type="button" (click)="clear()">Limpar</button>
    </div>
  </section>

  <section class="table-card">
    <div class="table-header">
      <div class="status-label">Resultados</div>
      <div *ngIf="loading" class="loading">Carregando...</div>
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>CPF</th>
            <th>Emissão</th>
            <th>Entrega</th>
            <th>Total</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let o of orders">
            <td>{{ o.id }}</td>
            <td>{{ o.customerName }}</td>
            <td>{{ o.customerCpf }}</td>
            <td>{{ o.issueDate }}</td>
            <td>{{ o.deliveryDate }}</td>
            <td>R$ {{ o.totalValue | number:'1.2-2' }}</td>
            <td class="actions-cell">
              <button class="secondary" (click)="view(o.id)">Visualizar</button>
              <button class="primary" (click)="edit(o.id)">Editar</button>
              <button class="danger" (click)="remove(o.id)">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</section>
